<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Pink background -->
  <rect width="320" height="320" fill="#f07097" rx="0"/>

  <!-- === UTENSILS crossed: whisk (left) + spatula (right) === -->

  <!-- WHISK — rotated left ~-30deg, pivot ~(160,78) -->
  <g transform="translate(160,78) rotate(-30)">
    <!-- balloon ellipse outline -->
    <ellipse cx="0" cy="-4" rx="13" ry="20" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <!-- center wire -->
    <line x1="0" y1="-24" x2="0" y2="16" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <!-- side wires -->
    <line x1="-9" y1="-10" x2="0" y2="16" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="9"  y1="-10" x2="0" y2="16" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <!-- handle -->
    <rect x="-5" y="15" width="10" height="46" rx="5" fill="white"/>
  </g>

  <!-- SPATULA — rotated right ~+30deg, pivot ~(160,78) -->
  <g transform="translate(160,78) rotate(30)">
    <!-- blade -->
    <rect x="-10" y="-26" width="20" height="36" rx="4" fill="white"/>
    <!-- neck connector -->
    <rect x="-4" y="9" width="8" height="10" rx="3" fill="white"/>
    <!-- handle -->
    <rect x="-5" y="17" width="10" height="46" rx="5" fill="white"/>
  </g>

  <!-- === LETTER K === -->
  <g transform="translate(26,148)">
    <rect x="0" y="0" width="15" height="108" rx="7" fill="white"/>
    <!-- upper arm -->
    <rect x="9" y="0" width="13" height="56" rx="6" fill="white" transform="rotate(37,9,54)"/>
    <!-- lower arm -->
    <rect x="9" y="54" width="13" height="58" rx="6" fill="white" transform="rotate(-37,9,54)"/>
  </g>

  <!-- === LETTER A (delta/triangle shape) === -->
  <g transform="translate(102,148)">
    <!-- left leg -->
    <rect x="-6" y="0" width="14" height="76" rx="6" fill="white" transform="rotate(-19,50,108)"/>
    <!-- right leg -->
    <rect x="-6" y="0" width="14" height="76" rx="6" fill="white" transform="rotate(19,50,108)"/>
    <!-- crossbar -->
    <rect x="16" y="62" width="52" height="13" rx="6" fill="white"/>
    <!-- tilde over A -->
    <path d="M22,-20 Q33,-36 44,-22 Q55,-8 66,-24" stroke="white" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- === LETTER N === -->
  <g transform="translate(192,148)">
    <rect x="0" y="0" width="15" height="108" rx="7" fill="white"/>
    <rect x="71" y="0" width="15" height="108" rx="7" fill="white"/>
    <!-- diagonal -->
    <rect x="5" y="0" width="14" height="115" rx="6" fill="white" transform="rotate(28,8,0)"/>
  </g>

  <!-- === SUPERSCRIPT M === -->
  <text x="282" y="170" font-family="Georgia,serif" font-size="38" font-weight="700" fill="white">M</text>

  <!-- === BOTTOM LABEL === -->
  <text x="160" y="296" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-size="13.5" font-weight="700" letter-spacing="4.5" fill="white">REPOSTERÍA Y CATERING</text>
  <line x1="30" y1="304" x2="290" y2="304" stroke="white" stroke-width="0.8" opacity="0.5"/>
</svg>
